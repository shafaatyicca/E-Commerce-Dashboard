<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings | Store Admin</title>
    <script>
      document.documentElement.setAttribute(
        "data-bs-theme",
        localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"),
      );
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-body-tertiary">
    <aside class="side" id="side">
      <a class="brand" href="index.html"
        ><i class="bi bi-bag-heart"></i><span class="lbl">Store Admin</span></a
      >
      <nav class="nav flex-column mt-2">
        <a class="nav-link" href="index.html" title="Dashboard"
          ><i class="bi bi-grid-1x2"></i><span class="lbl">Dashboard</span></a
        ><a class="nav-link" href="products.html" title="Products"
          ><i class="bi bi-box-seam"></i><span class="lbl">Products</span></a
        ><a class="nav-link" href="orders.html" title="Orders"
          ><i class="bi bi-receipt"></i><span class="lbl">Orders</span></a
        ><a class="nav-link" href="customers.html" title="Customers"
          ><i class="bi bi-people"></i><span class="lbl">Customers</span></a
        ><a class="nav-link active" href="settings.html" title="Settings"
          ><i class="bi bi-gear"></i><span class="lbl">Settings</span></a
        >
      </nav>
      <nav class="nav flex-column mt-auto mb-3">
        <a class="nav-link" href="login.html" title="Logout"
          ><i class="bi bi-box-arrow-left"></i
          ><span class="lbl">Logout</span></a
        >
      </nav>
    </aside>
    <div class="main">
      <header
        class="topbar sticky-top d-flex align-items-center gap-2 px-3 px-md-4"
      >
        <button class="btn btn-light d-lg-none" id="burger" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
        <form class="d-none d-md-block" style="width: 320px" role="search">
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-0"
              ><i class="bi bi-search"></i></span
            ><input
              class="form-control bg-body-tertiary border-0"
              type="search"
              placeholder="Search orders, products..."
              aria-label="Search"
            />
          </div>
        </form>
        <div class="ms-auto d-flex align-items-center gap-1">
          <button
            class="btn btn-light"
            id="themeBtn"
            aria-label="Toggle theme"
          ></button>
          <div class="dropdown">
            <button
              class="btn btn-light position-relative"
              data-bs-toggle="dropdown"
              aria-label="Notifications"
            >
              <i class="bi bi-bell"></i
              ><span
                class="position-absolute top-0 start-100 translate-middle p-1 bg-danger rounded-circle"
              ></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><h6 class="dropdown-header">Notifications</h6></li>
              <li>
                <a class="dropdown-item" href="orders.html">New order #1048</a>
              </li>
              <li>
                <a class="dropdown-item" href="products.html"
                  >Low stock: Half Sleeve Shirt</a
                >
              </li>
            </ul>
          </div>
          <div class="dropdown ms-1">
            <a
              class="d-flex align-items-center gap-2 text-decoration-none"
              href="#"
              data-bs-toggle="dropdown"
              ><span class="avatar">MW</span
              ><span class="d-none d-sm-block lh-sm text-body"
                ><span class="d-block fw-semibold small">Max Well</span
                ><span class="text-body-secondary small">Admin</span></span
              ></a
            >
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li>
                <a class="dropdown-item" href="settings.html">Settings</a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="login.html">Logout</a></li>
            </ul>
          </div>
        </div>
      </header>
      <main class="p-3 p-md-4">
        <div
          class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"
        >
          <div>
            <h1 class="h4 mb-0">Settings</h1>
            <small class="text-body-secondary"
              >Update your profile and store preferences.</small
            >
          </div>
          <div class="d-flex gap-2"></div>
        </div>
        <div class="card">
          <div class="card-header bg-transparent">
            <ul class="nav nav-tabs card-header-tabs" role="tablist">
              <li class="nav-item">
                <button
                  class="nav-link active"
                  data-bs-toggle="tab"
                  data-bs-target="#t1"
                  type="button"
                >
                  Profile
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  data-bs-toggle="tab"
                  data-bs-target="#t2"
                  type="button"
                >
                  Store
                </button>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  data-bs-toggle="tab"
                  data-bs-target="#t3"
                  type="button"
                >
                  Notifications
                </button>
              </li>
            </ul>
          </div>
          <div class="card-body tab-content">
            <div class="tab-pane fade show active" id="t1">
              <form class="row g-3" style="max-width: 640px">
                <div class="col-md-6">
                  <label class="form-label" for="a">Full name</label
                  ><input class="form-control" id="a" value="Max Well" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="b">Email</label
                  ><input
                    class="form-control"
                    id="b"
                    type="email"
                    placeholder="you@example.com"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label" for="c">Role</label
                  ><input class="form-control" id="c" value="Admin" disabled />
                </div>
                <div class="col-12">
                  <button class="btn btn-primary">Save changes</button>
                </div>
              </form>
            </div>
            <div class="tab-pane fade" id="t2">
              <form class="row g-3" style="max-width: 640px">
                <div class="col-md-6">
                  <label class="form-label" for="d">Store name</label
                  ><input class="form-control" id="d" value="Store" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="e">Currency</label
                  ><select class="form-select" id="e">
                    <option>USD ($)</option>
                    <option>EUR</option>
                    <option>PKR</option>
                  </select>
                </div>
                <div class="col-12">
                  <button class="btn btn-primary">Save store</button>
                </div>
              </form>
            </div>
            <div class="tab-pane fade" id="t3">
              <div class="form-check form-switch mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="n1"
                  checked
                /><label class="form-check-label" for="n1"
                  >Email me when a new order arrives</label
                >
              </div>
              <div class="form-check form-switch mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="n2"
                  checked
                /><label class="form-check-label" for="n2"
                  >Alert me about low stock</label
                >
              </div>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="n3" /><label
                  class="form-check-label"
                  for="n3"
                  >Weekly sales summary</label
                >
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer class="text-center text-body-secondary small pb-4">
        &copy; Store Admin. All rights reserved.
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
