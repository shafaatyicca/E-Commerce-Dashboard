<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Store Admin</title>
    <script>
      document.documentElement.setAttribute(
        "data-bs-theme",
        localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"),
      );
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="bg-body-tertiary d-flex align-items-center min-vh-100">
    <button
      class="btn btn-light position-fixed top-0 end-0 m-3"
      id="themeBtn"
      aria-label="Toggle theme"
    ></button>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-9 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <span class="ico bg-primary text-white mx-auto mb-3"
                  ><i class="bi bi-bag-heart"></i
                ></span>
                <h1 class="h4">Welcome back</h1>
                <p class="text-body-secondary mb-0">
                  Sign in to your dashboard
                </p>
              </div>
              <form action="index.html">
                <div class="mb-3">
                  <label class="form-label" for="em">Email</label
                  ><input class="form-control" id="em" type="email" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="pw">Password</label
                  ><input
                    class="form-control"
                    id="pw"
                    type="password"
                    required
                  />
                </div>
                <div class="d-flex justify-content-between mb-4">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="rm"
                    /><label class="form-check-label" for="rm"
                      >Remember me</label
                    >
                  </div>
                  <a href="#" class="small">Forgot password?</a>
                </div>
                <button class="btn btn-primary w-100">Sign in</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
